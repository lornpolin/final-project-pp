{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} – {{ shop_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="surface empty-state mx-auto" style="max-width: 560px">
    <div class="display-3 fw-bold text-brand">{{ code }}</div>
    <h1 class="h4 fw-bold mt-2">{{ title }}</h1>
    <p class="text-secondary">{{ message }}</p>
    <a href="{{ url_for('front.home') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to shop</a>
  </div>
</div>
{% endblock %}
